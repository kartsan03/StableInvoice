[package]
name = "stable-invoice"
version = "0.1.0"
description = "Escrowed USDC invoicing for freelancers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stable_invoice"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[profile.release]
overflow-checks = true
