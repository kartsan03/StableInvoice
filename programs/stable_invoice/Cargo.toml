[package]
name = "stable-invoice"
version = "0.1.0"
description = "Escrowed USDC invoicing for freelancers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stable_invoice"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"

[profile.release]
overflow-checks = true
